
<!DOCTYPE html>
<html>
<head>
    <title>Task 4</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="fullname"
                   value="Syed Muhammad Shaheer Ismail">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   value="shaheer.ismail123@gmail.com">
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   value="03106726411">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"
                   value="2006-01-16">
            <br><br>

            <p>Gender:</p>

            <input type="radio" id="male" name="gender" value="Male" checked>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Information</legend>

            <p>Subjects of Interest:</p>

            <input type="checkbox" id="cs" name="subjects" value="Computer Science" checked>
            <label for="cs">Computer Science</label>

            <input type="checkbox" id="physics" name="subjects" value="Physics">
            <label for="physics">Physics</label>

            <input type="checkbox" id="english" name="subjects" value="English">
            <label for="english">English</label>

            <input type="checkbox" id="math" name="subjects" value="Math">
            <label for="math">Math</label>

            <br><br>

            <label for="grade">Select Your Grade:</label>

            <select id="grade" name="grade">
                <option>9th</option>
                <option>10th</option>
                <option>11th</option>
                <option selected>12th</option>
            </select>

            <br><br>

            <label for="address">Address:</label>
            <br>

            <textarea id="address" name="address"
                      rows="4" cols="30">House 123, University Road, Peshawar</textarea>

        </fieldset>

        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
